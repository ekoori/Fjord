name: Release

# Tag-driven, so the artifacts are always built from a commit that exists in the history
# rather than from whatever happened to be on someone's machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    # Ubuntu for all four. Cross-publishing works from any host, and only a Linux runner
    # has a tar that records the executable bit without being told twice.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The gate before anything is published. A release that fails its own test suite is
      # worse than no release, because someone will be testing against it.
      - name: Test
        run: dotnet test --configuration Release

      - name: Package
        run: pwsh ./scripts/package.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fjord-${{ steps.version.outputs.value }}
          path: dist/*

      # Draft, not published. Somebody should look at the notes and the file sizes before
      # this becomes the thing people download.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
