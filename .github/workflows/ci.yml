name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # Both, deliberately. Development happens on Windows, and a Linux-only path bug —
    # case sensitivity, a separator assumption, an XDG directory — is invisible there
    # until someone tries to run it.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings are already errors via Directory.Build.props; --no-restore keeps this
      # step honest about what restore did.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  benchmark:
    # The performance gate the plan puts before any feature work. Advisory rather than
    # blocking: a shared CI runner's disk is not the machine anyone uses Fjord on, so a
    # slow result here is a signal to look, not a reason to fail the build.
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Generate benchmark trees
        run: ./scripts/make-benchmark-tree.ps1 -Only flat-100k
        shell: pwsh

      - name: Enumerate 100k entries
        run: dotnet run --project src/Fjord.App --configuration Release --no-build -- --bench bench/flat-100k
